spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=YEAR,LEVEL,ORDER,USER;IGNORECASE=TRUE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=never
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
jwt.access.secret=test_secret_key_random_long_string_for_testing_purposes
jwt.refresh.secret=test_secret_key_random_long_string_for_testing_purposes
jwt.access.expiration=3600000
jwt.refresh.expiration=1209600000
