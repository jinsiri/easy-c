spring.application.name=easyc
server.port=8081

# Import .env file
DB_USERNAME=postgres
DB_PASSWORD=postgres!23
DB_URL=jdbc:postgresql://localhost:5433/easyc
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=${DB_URL}

#JPA
userShowSql=true
spring.jpa.show_sql=${userShowSql}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.jdbc.order_inserts=true
spring.jpa.properties.hibernate.jdbc.order_updates=true
spring.jpa.properties.hibernate.query.plan_cache_max_size=256
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=64
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

# log
userLogLevel=INFO
logging.level.root=${userLogLevel}
logging.level.org.springframework.security=${userLogLevel}

# jwt
jwt.secret=Qx9!kA2$eP7L@rD4m#ZB8YcJw0NfT%S*
jwt.expiration=3600000
